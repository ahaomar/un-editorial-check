# Watches the published skills.sh record for this skill.
#
# What skills.sh publishes is a stored snapshot of the repository, and the
# three audits are run against that snapshot rather than against the default
# branch. The snapshot in place was taken at 11:27 UTC on 5 Oct 2026 and holds
# ea6c6d0, the pre-1.7.1 tree: its package.json reads 1.7.0, and its .gitignore
# predates the agent-install entries added in 1.8.1. e907670 — the hardening
# that answers the two findings the Socket scan reports — landed eleven minutes
# later, at 11:41 UTC, so the published warning has described a tree the
# default branch has moved past ever since.
#
# Socket confirmed to the maintainer on 6 Oct 2026, recorded in
# vercel-labs/skills#2371, that the scan is one skills.sh requests through its
# Socket integration, so pushing to GitHub or publishing to npm cannot refresh
# it. Until the snapshot is replaced on the skills.sh side, nothing in this
# repository is read by the scanner, and no commit can be its lever.
#
# The evidence needs no credentials:
#   https://skills.sh/api/download/ahaomar/un-editorial-check/un-editorial-check
#     "files", each with path and contents; the package.json there reads 1.7.0
#   https://skills.sh/api/v1/skills/audit/ahaomar/un-editorial-check/un-editorial-check
#     "audits", one row per scanner, each with status, summary and auditedAt
#
# The verdict is read from those endpoints by scripts/skills-sh-audit-watch.mjs,
# which `npm run check:syntax` covers and tests/audit-published-record.mjs
# locks. Scraping the security page instead is what an earlier version did, and
# that page splits its alert count across React comment boundaries — the markup
# is "2<!-- --> alert<!-- -->s<!-- --> found:" — so the count never matched,
# fell back to zero, and any newer snapshot would have been reported green.
#
# The run fails only when a snapshot other than the pinned one carries
# findings, so the Actions list itself answers "is it green yet?".
name: socket-audit-watch

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

# The checkout is the only repository access this run needs.
permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # No dependencies and no lockfile: the script imports node builtins only.
      - name: Read the published record
        run: node scripts/skills-sh-audit-watch.mjs
