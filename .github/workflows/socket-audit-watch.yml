# Watches the skills.sh Socket audit for this skill.
#
# The audit is not ours to trigger, and commits are not a lever. Socket
# confirmed to the maintainer on 6 Oct 2026 — recorded in vercel-labs/skills#2371
# — that the skills.sh audit is a scan skills.sh requests through its Socket
# integration, so pushing to GitHub or publishing to npm cannot refresh it:
# only a Vercel re-index moves the analysed commit. That is why the audit has
# stood on ea6c6d0 (the pre-1.7.1 tree) since 5 Oct 2026. #2371 asked for a
# re-index on 3 Oct, it ran at 11:30 UTC on 5 Oct, and e907670 — the fix for
# the two LOW findings it reports — landed eleven minutes later at 11:41 UTC.
#
# This workflow polls the public audit page hourly — no secrets, no
# dependencies on a local machine — and states plainly whether the scan is
# stale, green, or reporting alerts again. It fails only on a fresh scan that
# carries alerts, so the Actions list itself answers "is it green yet?".
name: socket-audit-watch

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check the skills.sh Socket audit
        run: |
          set -eu
          url='https://skills.sh/ahaomar/un-editorial-check/un-editorial-check/security/socket'
          # A server error is their outage, not our alert: distinguish it from
          # a real finding so a 500 cannot page us as a failed run. Two clean
          # retries, then the run reports the outage and exits green.
          if ! page=$(curl -fsSL --max-time 30 --retry 2 "$url" 2>/dev/null); then
            echo "SERVER ERROR — skills.sh did not serve the audit page (their side; possibly mid-update). Nothing to compare yet."
            exit 0
          fi
          # The audit pins the tree it analysed through the pkg:socket URL; the
          # first 40-hex hash on the page is that commit.
          analyzed=$(printf '%s' "$page" | grep -oE '[0-9a-f]{40}' | head -1 || true)
          if [ -z "$analyzed" ]; then
            echo "the page shows no analysed commit — its shape may have changed; inspect $url"
            exit 1
          fi
          echo "audited commit: $analyzed"
          # The last tree the scanner saw before the 1.7.1 hardening landed.
          stale=ea6c6d0b9952bd8bcda8cb53645fc0401ea11e38
          if [ "$analyzed" = "$stale" ]; then
            echo "STALE — the scan still corresponds to the pre-1.7.1 tree; the crawler has not come back yet."
            echo "If this persists for more than two days, report the stale index via https://security.vercel.com"
            exit 0
          fi
          alerts=$(printf '%s' "$page" | grep -oiE '[0-9]+[[:space:]]+alerts?' | head -1 || true)
          count=$(printf '%s' "${alerts:-0 alerts}" | grep -oE '[0-9]+')
          if [ "$count" -eq 0 ]; then
            echo "GREEN — the audit re-ran on a newer tree and reports no alerts."
            exit 0
          fi
          echo "ALERTS — the fresh scan reports ${alerts}. Findings, if the page names them:"
          printf '%s\n' "$page" | grep -iE 'LOW|MEDIUM|HIGH|\.mjs|\.json' | head -20
          exit 1
