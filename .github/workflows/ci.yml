name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # No dependencies and therefore no lockfile are required.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check:syntax
      - run: npm test
      - run: npm run check:portability
      # Every git-tracked JSON file must parse (the gitignored local .un-editorial.json is intentionally excluded).
      - run: node -e "const fs=require('fs'),cp=require('child_process');const files=cp.execSync('git ls-files').toString().trim().split('\n').filter(f=>f.endsWith('.json')&&fs.existsSync(f));for(const f of files){JSON.parse(fs.readFileSync(f,'utf8'));}console.log('json ok ('+files.length+' files)')"
      - run: npm pack --dry-run
      # Release gate: self-scan must exit 0 (bash -e fails the step on any non-zero exit).
      - run: node bin/check.mjs --self-scan --quiet
      - run: |
          tarball=$(npm pack --silent)
          prefix=$(mktemp -d)
          npm install --prefix "$prefix" --ignore-scripts --no-audit --no-fund "./$tarball"
          "$prefix/node_modules/.bin/un-editorial-check" --self-scan --quiet
          rm -rf "$prefix" "$tarball"
